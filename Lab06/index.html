<!DOCTYPE html>
<html>
<head>
    <title>Велодоріжки Києва</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background: #f9f9f9; }
        .container { max-width: 900px; margin: 0 auto; }
        
        iframe { width: 100%; height: 500px; border: 2px solid #ccc; border-radius: 8px; }
        
        .points-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); 
            gap: 10px; 
            margin-top: 20px; 
        }
        .bike-btn { 
            background: #27ae60; color: white; padding: 12px; 
            border: none; border-radius: 6px; cursor: pointer; text-align: left;
            font-size: 14px; transition: 0.2s;
        }
        .bike-btn:hover { background: #219653; }
        
        #info-box { 
            margin-top: 15px; padding: 15px; background: #e8f5e9; 
            border-left: 5px solid #27ae60; display: none; border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h3>Офіційна веломережа Києва та популярні локації</h3>
    <iframe src="https://data.kyivcity.gov.ua/dataset/velosypedna-merezha-kyieva-dep-transport/resource/52189675-e9d2-402d-b537-cc0f2ca3c41a/view/526f0b86-2935-4acf-8871-ea0212dba763" frameBorder="0"></iframe>
    <h4>Популярні відрізки:</h4>
    <div id="info-box"></div>
    <div class="points-grid" id="buttons-container"></div>
</div>

<script>
    const bikePoints = [
        { name: "Труханів острів", len: "5.5 км", desc: "Повністю пішохідна зона, ідеальний асфальт." },
        { name: "Набережна (Поштова площа)", len: "3.2 км", desc: "Доріжка вздовж Дніпра, гарний краєвид." },
        { name: "Парк Наталка (Оболонь)", len: "4.0 км", desc: "Сучасна паркова доріжка з розміткою." },
        { name: "ВДНГ (Урбан-парк)", len: "6.1 км", desc: "Велика лісова зона та спеціальні веломаршрути." },
        { name: "Гідропарк", len: "2.5 км", desc: "Доріжки серед дерев, вихід до пляжів." },
        { name: "Парк Партизанської слави", len: "3.0 км", desc: "Траса здоров'я навколо лісових озер." },
        { name: "Русанівська набережна", len: "2.0 км", desc: "Затишна доріжка вздовж каналу." },
        { name: "Парк Муромець", len: "5.0 км", desc: "Екстремальні та грунтові велотраси." }
    ];

    const container = document.getElementById('buttons-container');
    const infoBox = document.getElementById('info-box');

    bikePoints.forEach(p => {
        const btn = document.createElement('button');
        btn.className = 'bike-btn';
        btn.innerHTML = `<b>${p.name}</b><br>⏱ ${p.len}`;
        btn.addEventListener('click', () => {
            console.log(`Обрано локацію: ${p.name}, Довжина: ${p.len}`);
            infoBox.style.display = 'block';
            infoBox.innerHTML = `Дивіться цю ділянку на карті вище!<br><b>Локація:</b> ${p.name}<br><b>Довжина:</b> ${p.len}<br><b>Особливість:</b> ${p.desc}`;
        });
        container.appendChild(btn);
    });
</script>
</body>
</html>
